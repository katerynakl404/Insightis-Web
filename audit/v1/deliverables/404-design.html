<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — design reference (Insightis)</title>
<meta name="robots" content="noindex,follow">
<!-- Design reference for AUD-04. This page uses the ACTUAL design system (no hand-rolled styles):
     tokens + global + components are pulled from the repo's DS; the background is the reusable
     .ins-section--tint gradient; buttons are .ins-btn--primary / .ins-btn--secondary.
     Real implementation (insightis-site/public/404.html) should likewise LINK the DS CSS
     (as the Storybook *.html pages do) instead of copying hex values. -->
<link rel="stylesheet" href="../../../design-system/ds/index.css">
<style>
  /* Layout only — every colour, font, radius, button and the background come from the DS above. */
  html,body{height:100%}
  html{background:var(--ins-surface-page)}                 /* dark base — the tint below is only an overlay */
  body{margin:0;display:flex;flex-direction:column;min-height:100vh;color:var(--ins-text-body)}
  .n4-header{padding:22px 24px}
  .n4-brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ins-text-heading)}
  .n4-brand svg{width:26px;height:24px;display:block}
  .n4-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .n4-box{max-width:560px}
  .n4-code{font-size:clamp(84px,18vw,150px);line-height:.9;font-weight:800;letter-spacing:-.04em;margin:0;
    background:linear-gradient(135deg,var(--ins-color-teal-400) 0%,var(--ins-color-teal-500) 55%,var(--ins-color-teal-650) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .n4-lead{max-width:44ch;margin:16px auto 30px}
  .n4-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .n4-links{margin-top:34px;padding-top:22px;border-top:1px solid var(--ins-border-default)}
  .n4-links nav{display:flex;gap:8px 22px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .n4-footer{padding:20px 24px;text-align:center}
</style>
</head>
<body class="ins-section--tint">
  <header class="n4-header">
    <a class="n4-brand" href="/" aria-label="Insightis home">
      <svg viewBox="0 0 25.5 22.84" aria-hidden="true"><path d="M25.4928 10.4151L21.6736 12.7512L25.4928 15.0767L12.7464 22.8371L0 15.0767L3.81921 12.7512L0 10.4151L5.73562 6.92339L7.64785 8.08747L3.82392 10.4151L12.7464 15.8473L21.6689 10.4151L17.845 8.08747L19.7572 6.92339L25.4928 10.4151ZM12.7464 18.1755L5.72881 13.9031L3.8234 15.0767L12.7464 20.5095L21.6694 15.0767L19.7635 13.9031L12.7464 18.1755ZM17.845 10.4209L12.7464 13.525L7.64785 10.4209L9.56426 9.25421L12.7464 11.1915L15.9286 9.25421L17.845 10.4209ZM17.845 5.75931L12.7464 8.86335L7.64785 5.75931L12.7464 2.65527L17.845 5.75931ZM11.4718 5.75878L12.7464 6.53519L14.0211 5.75878L12.7464 4.9829L11.4718 5.75878Z" fill="var(--ins-color-teal-400)"/></svg>
      <span class="ins-text-h4" style="letter-spacing:-.01em">Insightis</span>
    </a>
  </header>

  <main class="n4-main">
    <div class="n4-box">
      <p class="n4-code">404</p>
      <h1 class="ins-text-h2">This page doesn’t exist</h1>
      <p class="ins-text-body ins-text--muted n4-lead">The page you’re looking for was moved, renamed, or is still on the way. Let’s get you back to your data.</p>
      <div class="n4-actions">
        <a class="ins-btn ins-btn--primary ins-btn--lg ins-btn--radius-pill" href="/">Back to home</a>
        <a class="ins-btn ins-btn--secondary ins-btn--lg ins-btn--radius-pill" href="/pricing">See pricing</a>
      </div>
      <div class="n4-links">
        <h2 class="ins-text-h4">Popular pages</h2>
        <nav>
          <a href="/platform/ai-chat">AI Chat</a>
          <a href="/platform/integrations">Integrations</a>
          <a href="/platform/semantic-layer">Semantic Layer</a>
          <a href="/docs/">Documentation</a>
          <a href="/resources/contact-support">Support</a>
        </nav>
      </div>
    </div>
  </main>

  <footer class="n4-footer ins-text-caption">© Devart — Insightis · AI Analytics Workspace</footer>
</body>
</html>
