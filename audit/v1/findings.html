<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insightis — Audit v1 · Findings (source of truth)</title>
<style>
  :root{
    --page:#0A0E13; --surface:#0D1117; --line:rgba(255,255,255,0.08);
    --heading:#E8F2F5; --text:#C0D4DC; --muted:#7FA0AC; --teal:#0EC4C1; --code:#131820;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .bar .brand{color:var(--heading);font-weight:700}
  .bar a{color:var(--teal);text-decoration:none;font-size:13px}.bar a:hover{text-decoration:underline}
  .doc h1{color:var(--heading);font-size:24px;margin:26px 0 6px;line-height:1.25}
  .doc h2{color:var(--heading);font-size:16px;margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);letter-spacing:.02em}
  .doc h3{color:var(--heading);font-size:14.5px;margin:22px 0 6px}
  .doc h4{color:var(--heading);font-size:13px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .doc p{margin:8px 0}
  .doc a{color:var(--teal);text-decoration:none}.doc a:hover{text-decoration:underline}
  .doc strong{color:var(--heading)}
  .doc em{color:var(--text);font-style:italic}
  .doc code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--code);color:var(--heading);padding:1px 5px;border-radius:3px}
  .doc blockquote{border-left:3px solid var(--teal);margin:12px 0;padding:2px 0 2px 14px;color:var(--muted)}
  .doc blockquote p{margin:4px 0}
  .doc ul,.doc ol{margin:8px 0;padding-left:22px}.doc li{margin:3px 0}
  .doc hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  .doc table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12.5px;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .doc th{color:var(--heading);background:rgba(255,255,255,0.03);font-weight:600}
  .doc td{color:var(--text)}
  .status{color:var(--muted);font-size:13px;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="brand">&#9670; Insightis &mdash; Audit v1 &middot; Findings</span>
    <a href="deliverables/report-visual.html">&larr; Back to report</a>
  </div>
  <div id="doc" class="doc"><p class="status">Loading findings.md&hellip;</p></div>
</div>
<script src="md-view.js"></script>
<script>renderMarkdownDoc('findings.md');</script>
</body>
</html>
